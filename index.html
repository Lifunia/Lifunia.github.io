<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Lifuniaで公開しているアプリやツールを紹介するサイトです。">
    <title>Lifunia</title>
    <link rel="stylesheet" href="assets/css/style.css">
  </head>
  <body>
    <header class="site-header">
      <div class="container">
        <a class="site-name" href="./" aria-label="Lifunia トップページ">Lifunia</a>
      </div>
    </header>

    <main>
      <section class="hero" aria-labelledby="page-title">
        <div class="container">
          <h1 id="page-title">Lifunia</h1>
          <p class="lead">Lifuniaで公開しているアプリやツールを紹介するサイトです。</p>
        </div>
      </section>

      <section class="section" aria-labelledby="products-title">
        <div class="container">
          <h2 id="products-title">Products</h2>
          <!-- アプリを追加する際は、この一覧に product-card を追加します。 -->
          <div class="product-grid">
            <a class="product-card" href="sauna-timer/">
              <h3>Sauna Timer</h3>
              <p>Garmin向けのサウナタイマーアプリ</p>
              <span class="card-link" aria-hidden="true">詳しく見る <span>→</span></span>
            </a>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">
        <small>&copy; Lifunia</small>
      </div>
    </footer>
  </body>
</html>
