<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Lifuniaで公開しているアプリやツールを紹介するサイトです。">
    <title>Lifunia</title>
    <link rel="stylesheet" href="assets/css/style.css">
  </head>
  <body>
    <header class="site-header">
      <div class="container">
        <a class="site-name" href="./" aria-label="Lifunia トップページ" translate="no">Lifunia</a>
      </div>
    </header>

    <main>
      <section class="hero" aria-labelledby="page-title">
        <div class="container">
          <h1 id="page-title" translate="no">Lifunia</h1>
          <p class="lead">Lifuniaで公開しているアプリやツールを紹介するサイトです。</p>
        </div>
      </section>

      <section class="section" aria-labelledby="products-title">
        <div class="container">
          <h2 id="products-title">Products</h2>
          <!-- アプリを追加する際は、この一覧に product-card を追加します。 -->
          <div class="product-grid">
            <a class="product-card product-card-sauna-timer" href="sauna-timer/">
              <p class="product-card-eyebrow" lang="en" translate="no">Garmin App</p>
              <h3 translate="no">Sauna Timer</h3>
              <p>Garmin向けのサウナタイマーアプリ</p>
              <span class="card-link" aria-hidden="true">詳しく見る <span>→</span></span>
            </a>
            <a class="product-card product-card-totonel" href="totonel/">
              <p class="product-card-eyebrow" lang="en" translate="no">Android App</p>
              <h3>ととねる</h3>
              <p>サウナセッションの心拍と記録を、あとから振り返るアプリ</p>
              <span class="card-link" aria-hidden="true">詳しく見る <span>→</span></span>
            </a>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">
        <small>&copy; Lifunia</small>
      </div>
    </footer>
    <!-- Cloudflare Web Analytics -->
    <script type="module" src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "f4ab082f7ac24d65a5237a328bd618d1"}'></script>
    <!-- End Cloudflare Web Analytics -->
  </body>
</html>
